<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Javenyx Essentials | by Tales Print</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #fdfdfd; padding: 15px; padding-bottom: 90px; padding-top: 70px;}
    
    /* 1. FIXED HEADER */
    header { position: fixed; top: 0; left: 0; width: 100%; background: #fff; z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #edf2f7; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .javenyx-logo { max-width: 130px; }
    .call-btn { background: linear-gradient(135deg, #2a4365 0%, #1a202c 100%); color: white; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; font-size: 13px; text-decoration: none; display: flex; align-items: center; gap: 8px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
    
    /* Amazon-style visual Hero Banner */
    .hero-banner { background: #2a4365; color: #fff; padding: 35px 20px; border-radius: 12px; max-width: 1000px; margin: 0 auto 25px; text-align: center; }
    .hero-banner h1 { font-size: 22px; margin-bottom: 10px; color: #fff;}
    .hero-banner p { font-size: 14px; color: #e2e8f0; }

    /* LEVEL 1: Visual Category Grid */
    .cat-showcase { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; max-width: 1000px; margin: 0 auto; }
    .showcase-card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.04); cursor: pointer; transition: transform 0.1s; border: 1px solid #f1f5f9; position: relative;}
    .showcase-card:active { transform: translateY(1px); }
    .showcase-card img { width: 100%; height: 130px; object-fit: contain; padding: 10px; background: #fff; border-bottom: 1px solid #edf2f7;}
    .showcase-card h3 { font-size: 14px; color: #2d3748; padding: 12px; font-weight: bold; }
    
    /* Footer Branding */
    footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; padding: 12px 15px; border-top: 1px solid #edf2f7; display: flex; align-items: center; justify-content: space-between; max-width: 100%; box-shadow: 0 -3px 10px rgba(0,0,0,0.03); z-index: 999; }
    .footer-tp-logo { max-height: 25px; }
    .cart-btn-fixed { position: fixed; bottom: 15px; right: 15px; background: #25D366; color: white; text-decoration: none; border-radius: 30px; padding: 15px; font-size: 14px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- FIXED HEADER: Branding & Call Now -->
  <header>
    <img src="javenyx-logo.png" alt="Javenyx Logo" class="javenyx-logo">
    <a href="tel:7003282856" class="call-btn">Call</a>
  </header>

  <!-- Amazon-style Hero -->
  <div class="hero-banner">
      <h1>Reliable. Day to Day. Ready to Ship.</h1>
      <p>Functional utility goods, curated daily by Tales Print.</p>
  </div>

  <!-- LEVEL 1: Visual Category Cards -->
  <div class="cat-showcase" id="categoryShowcase">
    <!-- These placeholder URLs will generate the visual category icons derived from the Category Summary mapping. -->
    <div class="showcase-card" onclick="openCategoryPage('Kitchen & Home Utilities')">
      <img src="https://via.placeholder.com/200x130/e6fffa/2c7a7b?text=Kitchen" alt="Kitchen Utility Icon">
      <h3>Kitchen & Home Utilities</h3>
    </div>
    <div class="showcase-card" onclick="openCategoryPage('Organization & Storage')">
      <img src="https://via.placeholder.com/200x130/edf2f7/2a4365?text=Storage" alt="Storage Utility Icon">
      <h3>Organization & Storage</h3>
    </div>
    <div class="showcase-card" onclick="openCategoryPage('Beauty & Travel Essentials')">
      <img src="https://via.placeholder.com/200x130/fdf2f8/702459?text=Beauty" alt="Beauty Utility Icon">
      <h3>Beauty & Travel Essentials</h3>
    </div>
    <div class="showcase-card" onclick="openCategoryPage('Hardware & Office Supplies')">
      <img src="https://via.placeholder.com/200x130/fffaf0/9c4221?text=Tools" alt="Tools Utility Icon">
      <h3>Hardware & Office Supplies</h3>
    </div>
    <div class="showcase-card" onclick="openCategoryPage('Gifts & Miscellaneous')">
      <img src="https://via.placeholder.com/200x130/f0fff4/276749?text=Gifts" alt="Gifts Utility Icon">
      <h3>Gifts & Miscellaneous</h3>
    </div>
  </div>

  <!-- FIXED FOOTER -->
  <footer>
    <img src="tales-print-logo.png" alt="Tales Print Logo" class="footer-tp-logo">
    <span>talesprint.com/javenyx</span>
  </footer>

  <a href="cart.html" class="cart-btn-fixed hidden" id="cartFixedCount">Cart (0)</a>

  <script src="cart.js"></script>
  <script>
    // Initialize Local Storage Category browsing
    function openCategoryPage(catName) {
        localStorage.setItem('javenyx_explore_cat', catName);
        window.location.href = 'category.html';
    }
  </script>
</body>
</html>
